name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint Code
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Core Tests
        run: npm test

      - name: Verify Next.js Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Dummy values for build validation
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/savelo_idp?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_PRIVATE_KEY: ""
          JWT_PUBLIC_KEY: ""
          OTP_PEPPER_SECRET: "ci-dummy-pepper-secret-32-chars-long"
